<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accesso</title><link rel="stylesheet" href="/static/style.css"></head><body class="v2-auth"><header class="v2-auth-brand"><a href="/">Audio Bot</a><span>Area amministrativa</span></header><main class="container"><section class="card card-narrow"><h1>Accesso amministratore</h1><form id="login"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn btn-primary">Accedi</button></form><p id="result" role="status"></p><p><a href="/recovery">Recupera accesso</a></p><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const d=await r.json();if(r.ok)location.href='/';else document.querySelector('#result').textContent=d.error;});</script></section></main></body></html>
