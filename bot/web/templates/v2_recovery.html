<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recupero accesso</title><link rel="stylesheet" href="/static/style.css"></head><body class="v2-auth"><header class="v2-auth-brand"><a href="/">Audio Bot</a><span>Area amministrativa</span></header><main class="container"><section class="card card-narrow"><h1>Recupero accesso</h1><p>Genera un codice locale eseguendo <code>python -m bot.v2_recovery</code> sul server. Il codice scade dopo 30 minuti e si usa una sola volta.</p><form id="recovery"><label for="code">Codice locale</label><input id="code" autocomplete="off" required><label for="password">Nuova password</label><input id="password" type="password" autocomplete="new-password" required><button class="btn btn-primary">Reimposta password</button></form><p id="result" role="status"></p><a href="/login">Torna al login</a><script src="/static/password_errors.js"></script><script>document.querySelector('#recovery').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/recovery/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:document.querySelector('#code').value,password:document.querySelector('#password').value})});const d=await r.json();document.querySelector('#result').textContent=r.ok?'Password aggiornata. Accedi con quella nuova.':window.v2PasswordError(d.error);});</script></section></main></body></html>
